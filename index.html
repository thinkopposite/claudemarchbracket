<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>March Bracket Analyzed</title>
<meta name="description" content="2026–27 NCAA Division I men's basketball: conference standings, schedules, and a continuously updated 2027 NCAA Tournament bracket forecast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Google Sans';font-style:normal;font-weight:400;font-display:swap;src:local('Google Sans'),local('GoogleSans-Regular'),url(https://fonts.gstatic.com/s/googlesans/v58/4UaGrENHsxJlGDuGo1OIlL3Kwp5MKg.woff2) format('woff2');}
@font-face{font-family:'Google Sans';font-style:normal;font-weight:500;font-display:swap;src:local('Google Sans Medium'),local('GoogleSans-Medium'),url(https://fonts.gstatic.com/s/googlesans/v58/4UabrENHsxJlGDuGo1OIlLU94YtzCwY.woff2) format('woff2');}
@font-face{font-family:'Google Sans';font-style:normal;font-weight:700;font-display:swap;src:local('Google Sans Bold'),local('GoogleSans-Bold'),url(https://fonts.gstatic.com/s/googlesans/v58/4UabrENHsxJlGDuGo1OIlLV154tzCwY.woff2) format('woff2');}
:root{
  /* NCAA palette: logo blue (Pantone 2925 C, RGB 0/156/222), NCAA medium blue for small text, white, black, cool greys */
  --bg:#f4f5f5;--s1:#ebeced;--s2:#e2e3e3;--s3:#d9d9d6;--card:#fff;
  --b0:#d9d9d6;--b1:#b1b3b3;--b2:#8b8e90;
  --ink:#000;--ink2:#63666a;--ink3:#75787b;
  --acc:#009cde;--acc2:#e6f5fc;--acc3:#0077c8;
  --grn:#0077c8;--grn2:#e6f5fc;--red:#63666a;--red2:#f1f2f2;--gld:#b1b3b3;--gld2:#f1f2f2;--blu:#0077c8;--blu2:#e6f5fc;--cyn:#fff;--cyn2:#000;
  --rg0:#009cde;--rg1:#000;--rg2:#63666a;--rg3:#0077c8;
  --f-ui:'Google Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mo:'Roboto Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:6px;--rl:10px;--px:clamp(14px,4vw,32px);
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 8px 28px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:4px}
h2{font-size:1.25rem;font-weight:500;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:500}
h3 small,h4 small{font-weight:400;color:var(--ink2);font-size:.8em;margin-left:.4em}
.mut{color:var(--ink2)} .small{font-size:12px}
.num{font-family:var(--f-mo);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
sup{font-size:.62em;color:var(--acc3);margin-left:1px;font-family:var(--f-mo)}

/* Header */
.top{background:var(--s1);border-top:5px solid var(--acc);border-bottom:1px solid var(--b0);padding:clamp(12px,2.2vw,20px) var(--px) 0}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand h1{font-size:clamp(1.55rem,3.6vw,2.4rem);font-weight:500;letter-spacing:-.03em;line-height:1.05}
.brand p{color:var(--ink2);font-size:13.5px;margin-top:4px}
.brand #phase-name{color:var(--ink);font-weight:500}
.act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.act-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
#refresh{display:inline-flex;align-items:center;gap:9px;background:var(--acc);color:#fff;font-weight:500;font-size:15px;padding:11px 20px;border-radius:999px;box-shadow:var(--shadow-sm);transition:background .15s}
#refresh:hover{background:#000} #refresh:disabled{cursor:progress;background:var(--ink2)}
#refresh svg{width:17px;height:17px;flex-shrink:0}
#refresh.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#refresh.busy svg{animation:none}}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.sw input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--b1);position:relative;cursor:pointer;transition:background .15s;flex-shrink:0}
.sw input::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--grn)} .sw input:checked::after{transform:translateX(12px)}
#status{font-family:var(--f-mo);font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;text-align:right}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gld);flex-shrink:0} .dot.ok{background:var(--grn)}
#progress{height:3px;background:var(--b0);margin:12px calc(-1*var(--px)) 0;overflow:hidden}
#progress i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}

/* Season track — the signature element */
.track{display:flex;list-style:none;margin:18px calc(-1*var(--px)) 0;padding:0 var(--px);overflow-x:auto;scrollbar-width:none;counter-reset:st}
.track::-webkit-scrollbar{display:none}
.track li{flex:1 0 auto;min-width:92px;position:relative;padding:14px 12px 12px 0;display:flex;flex-direction:column;gap:1px}
.track li::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--b0)}
.track li.past::before{background:var(--acc)}
.track li.now::before{background:linear-gradient(90deg,var(--acc) 50%,var(--b0) 50%)}
.track li.now::after{content:'';position:absolute;top:-5px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--s1)}
.tk-l{font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tk-d{font-family:var(--f-mo);font-size:10.5px;color:var(--ink3)}
.track li.past .tk-l{color:var(--ink)} .track li.now .tk-l{color:var(--acc3)} .track li.now .tk-d{color:var(--acc)}

/* Tabs */
.tabs{display:flex;gap:2px;background:var(--s1);border-bottom:1px solid var(--b0);padding:0 var(--px);position:sticky;top:0;z-index:50;overflow-x:auto;scrollbar-width:none}
.tab{padding:12px 14px 11px;font-size:14.5px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)} .tab.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:500}
main{padding:clamp(14px,2.4vw,24px) var(--px) 60px;max-width:1500px;margin:0 auto}

/* Common */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--b0);background:var(--card);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--b2);color:var(--ink)} .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .bn{font-family:var(--f-mo);font-size:10.5px;background:var(--acc2);color:var(--acc3);border-radius:999px;padding:0 6px}
.chip.on .bn{background:rgba(255,255,255,.2);color:#fff}
.btn-q{font-size:13px;color:var(--acc3);border:1px solid var(--b1);border-radius:999px;padding:5px 12px;background:var(--card)}
.btn-q:hover{border-color:var(--acc)}
.tb-r{display:flex;gap:10px;align-items:center}
.lede{color:var(--ink2);font-size:14px;margin-bottom:14px;max-width:78ch}
.lede strong{color:var(--ink);font-weight:500}
.warn,.done-note{font-size:13.5px;padding:9px 12px;border-radius:var(--r);margin-bottom:12px;max-width:90ch}
.warn{background:var(--gld2);color:#000;border:1px solid var(--b1);border-left:4px solid var(--ink2)}
.done-note{background:var(--grn2);color:#000;border:1px solid rgba(0,156,222,.35);border-left:4px solid var(--acc)}
.empty{background:var(--card);border:1px dashed var(--b1);border-radius:var(--rl);padding:22px;max-width:70ch;margin-bottom:18px}
.empty h3{margin-bottom:6px} .empty p{color:var(--ink2)} .empty.sm{padding:14px}
.tl{font-weight:500;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:2px}
.tl:hover{text-decoration-color:var(--b2)} .tl.big{font-size:1.35rem;letter-spacing:-.01em}
.ap{font-family:var(--f-mo);font-size:10px;color:var(--ink2);margin-left:5px;vertical-align:1px}
.ap::before{content:'#'}
.lg{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:7px}
.aqb,.inel{font-family:var(--f-mo);font-size:9.5px;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.aqb{background:var(--cyn2);color:var(--cyn)} .inel{background:var(--s2);color:var(--ink2)}
.dl{font-family:var(--f-mo);font-size:10.5px;margin-left:4px;white-space:nowrap}
.dl.up{color:var(--grn);font-weight:600} .dl.dn{color:var(--red)}
.search{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--b1);border-radius:999px;background:var(--card);min-width:min(260px,100%)}
.tscroll{overflow-x:auto;background:var(--card);border:1px solid var(--b0);border-radius:var(--rl);box-shadow:var(--shadow-sm)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;font-weight:500;color:var(--ink2);text-align:left;padding:9px 10px;border-bottom:1px solid var(--b0);background:var(--s1);white-space:nowrap;position:sticky;top:0}
th button{font-weight:500;color:inherit;font-size:inherit} th button.on{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--s2);white-space:nowrap}
tbody tr:hover td{background:#f7f8f8}
td.tm{min-width:190px} td.reg{font-size:12px;color:var(--ink2)}
.hm{display:inline-block;min-width:52px;text-align:right;padding:2px 6px;border-radius:4px;background:rgba(0,156,222,var(--a))}

/* Bracket */
.bk-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:18px}
@media (max-width:980px){.bk-top{grid-template-columns:1fr}}
.ff,.region,.orsec,.bubble,.trend,.games{background:var(--card);border:1px solid var(--b0);border-radius:var(--rl);box-shadow:var(--shadow-sm)}
.ff header,.region header,.orsec header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--s2)}
.ff header span,.region header span,.orsec header span{font-size:12.5px;color:var(--ink2)}
.region{margin-bottom:16px;border-top:4px solid var(--rc)}
.region h3{color:var(--rc);font-size:1.1rem}
.ffwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:14px 16px}
.ffg h4,.bcol h4{font-size:11.5px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.champ{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--s2);padding-top:12px}
.c-l{font-size:12.5px;color:var(--ink2)} .c-p{font-family:var(--f-mo);font-size:13px;color:var(--acc3)}
.bubble{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13.5px}
.bubble h4{font-size:12.5px;font-weight:500;margin:0 0 5px}
.bubble ol,.bubble ul{list-style:none;margin-bottom:10px}
.bubble li{padding:2px 0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.bubble li .mut{font-size:12px}
.bubble .aqs{grid-column:1/-1;border-top:1px solid var(--s2);padding-top:10px}
.bubble .aqs ul{columns:2 190px;column-gap:18px}
.bubble .aqs li{break-inside:avoid;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--s2);padding:3px 0}
.bubble .aqs li .tl{text-align:right}
.contenders{padding:4px 16px 14px}
.contenders h4{font-size:12.5px;font-weight:500;margin:6px 0 6px}
.contenders ol{list-style:none}
.contenders li{display:grid;grid-template-columns:22px minmax(110px,1fr) 88px minmax(60px,1.2fr) 56px 54px;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--s2);font-size:13.5px}
.contenders .cr{font-family:var(--f-mo);font-size:11px;color:var(--ink3)}
.contenders .sm{font-size:11.5px}
.cbar{height:8px;background:var(--s2);border-radius:999px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--acc)}
.contenders .num{text-align:right}
@media (max-width:560px){.contenders li{grid-template-columns:20px 1fr 50px 48px}.contenders .sm,.contenders .cbar{display:none}}
.orsec{margin-bottom:16px}
.orgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:14px 16px}
.org-h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:4px}
.bscroll{overflow-x:auto;padding:12px 16px 16px}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr)) minmax(180px,.9fr);gap:14px;min-width:1040px}
.bcol{display:flex;flex-direction:column}
.bgames{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:10px}
.bg{border:1px solid var(--b0);border-radius:var(--r);overflow:hidden;background:var(--card)}
.bt{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:6px;padding:6px 9px;font-size:13.5px;cursor:pointer;min-height:34px}
.bt+.bt{border-top:1px solid var(--s2)}
.bt:hover{background:var(--acc2)}
.bt.won{box-shadow:inset 3px 0 0 var(--acc)}
.bt .sd{font-family:var(--f-mo);font-size:11px;color:var(--ink2);text-align:right}
.bt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt .nm em{font-style:normal;font-family:var(--f-mo);font-size:10.5px;color:var(--ink3)}
.bt .pr{font-family:var(--f-mo);font-size:12px;color:var(--ink2)}
.bt .orx{display:block;font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.bt.won{background:var(--grn2)} .bt.won .pr{color:var(--grn);font-weight:600}
.bt.lost .nm{color:var(--ink3);text-decoration:line-through}
.bt.locked{box-shadow:inset 3px 0 0 var(--blu)} .bt.locked .pr::after{content:' ✓';color:var(--blu)}
.bt.tbd{cursor:default;color:var(--ink3)}
.bg.solo .bt{min-height:44px;font-size:14.5px}

/* Conferences */
.cstrip{margin-bottom:16px}
.chead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.chead p{margin-top:3px;font-size:14px}
.games{margin-top:18px;padding:14px 16px}
.games h3{font-size:1rem}
.glist{list-style:none}
.gday{font-size:12px;font-weight:500;color:var(--ink2);padding:12px 0 4px;border-bottom:1px solid var(--s2)}
.gm{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--s2);align-items:center}
.gmain{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gt .ap{margin:0 3px 0 0}
.gd{font-family:var(--f-mo);font-size:11.5px;color:var(--ink2);min-width:92px}
.nextg li{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:5px 0;border-bottom:1px solid var(--s2)}
.nextg li .sm{grid-column:1/-1;font-size:11.5px}
.nextg{grid-template-columns:1fr}
.gt b{font-family:var(--f-mo);font-weight:500;margin-left:4px}
.gt.w .tl,.gt.w b{font-weight:700}
.at{color:var(--ink3);font-size:12px}
.gmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.res{font-family:var(--f-mo);font-size:12px} .res.w{color:var(--grn);font-weight:600} .res.l{color:var(--red);font-weight:600}
.tag{background:var(--s1);border-radius:4px;padding:1px 6px;font-size:11px} .tag.tv{background:var(--blu2);color:var(--blu)}
.plc{color:var(--ink3)}
.live{color:#fff;background:#000;border-radius:4px;padding:0 5px;font-size:10.5px}

/* Movement */
.mvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:18px}
.mvgrid section{background:var(--card);border:1px solid var(--b0);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--shadow-sm)}
.mvgrid h3{font-size:14px;margin-bottom:8px}
.mv{list-style:none;counter-reset:m}
.mv li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--s2);font-size:13.5px}
.trend{padding:14px 16px}
.trend h3{margin-bottom:8px}
.trend .tscroll{border:0;box-shadow:none}
.trend svg{width:100%;min-width:600px;height:auto;display:block}
.trend .gl{stroke:var(--s2)} .trend .ax{font-family:var(--f-mo);font-size:10px;fill:var(--ink3)} .trend .lb{font-size:11.5px;font-weight:500}

/* Drawer */
#drawer{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:400;transition:background .2s}
#drawer.open{background:rgba(0,0,0,.32)}
.dpanel{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);box-shadow:var(--shadow-md);overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 40px)}
#drawer.open .dpanel{transform:none}
@media (prefers-reduced-motion:reduce){.dpanel,#drawer{transition:none}}
.dtop{position:sticky;top:calc(-1*env(safe-area-inset-top,0px) - 18px);margin:-18px -22px 0;padding:12px 22px 8px;display:flex;justify-content:flex-end;background:var(--bg);z-index:3}
.dpanel .x{font-size:13px;border:1px solid var(--b1);border-radius:999px;padding:5px 12px;background:var(--card)}
.dh{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.dlg{width:44px;height:44px;object-fit:contain}
.dh h2{font-size:1.5rem;letter-spacing:-.02em}
.dh p{font-size:13px}
.dpanel h3{margin:20px 0 8px}
.kpis,.recs,.stg{display:grid;gap:8px}
.kpis{grid-template-columns:repeat(4,1fr)} .recs{grid-template-columns:repeat(7,1fr);margin-top:8px} .stg{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.recs{grid-template-columns:repeat(4,1fr)}.stg{grid-template-columns:repeat(3,1fr)}}
.kpis>div,.recs>div,.stg>div{background:var(--card);border:1px solid var(--b0);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column}
.kpis span,.recs span,.stg span,.trends span{font-size:11.5px;color:var(--ink2)}
.kpis b{font-size:1.3rem;font-weight:500;font-family:var(--f-mo)} .recs b,.stg b{font-family:var(--f-mo);font-weight:500;font-size:14px}
.kpis small{font-size:11px;color:var(--ink2)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:110px 1fr 104px;gap:10px;align-items:center;font-size:13px}
.bt2{height:10px;background:var(--s2);border-radius:999px;overflow:hidden}
.bt2 i{display:block;height:100%;background:var(--acc);border-radius:999px}
.bv{font-family:var(--f-mo);font-size:12px;text-align:right}
.trends{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trends>div{background:var(--card);border:1px solid var(--b0);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.spark{width:100%;height:36px}
.dpanel .games{margin-top:20px;background:transparent;border:0;box-shadow:none;padding:0}

.method{max-width:72ch;background:var(--card);border:1px solid var(--b0);border-radius:var(--rl);padding:22px 26px}
.method h2{margin-bottom:12px} .method p{margin-bottom:12px;line-height:1.65}

// ═══════════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════════
const CFG = {
  SEASON: 2027,                 // ESPN season id for the 2026–27 season
  LABEL: '2026–27',
  SEASON_START: '2026-11-02',
  CONF_TOURNEYS: '2027-03-01',
  SELECTION_SUNDAY: '2027-03-14',
  SEASON_END: '2027-04-06',
  FIELD: 76, AL_BIDS: 44, OR_AQ: 12, OR_AL: 12,   // 2027 format: 76 teams, 12 Opening Round games
  HCA: 3.2,                     // home-court advantage, points
  SIGMA: 11,                    // single-game margin std. dev., points
  PRIOR_GAMES: 6,               // weight of the preseason rating, in games
  NON_D1: -22,                  // rating used for non-Division I opponents
  PROXY: '',                    // optional CORS proxy prefix, e.g. 'https://my-worker.example/?url='
  ESPN: 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball',
  ESPN2: 'https://site.api.espn.com/apis/v2/sports/basketball/mens-college-basketball',
  REGIONS: ['East','South','West','Midwest'],
  // Final Four pairings once the official bracket is out (update on Selection Sunday if needed)
  FF_ACTUAL: [['East','West'],['South','Midwest']],
  KEY: 'mba.v1.'
};
const ROUNDS = ['OR','R64','R32','S16','E8','F4','NCG','CH'];
const RLABEL = {OR:'Opening Round',R64:'First round',R32:'Second round',S16:'Sweet 16',E8:'Elite Eight',F4:'Final Four',NCG:'Title game',CH:'Champion'};
const RSHORT = {R32:'R32',S16:'S16',E8:'E8',F4:'F4',NCG:'Final',CH:'Title'};
const RGAMES = {OR:12,R64:32,R32:16,S16:8,E8:4,F4:2,NCG:1};
const NCAA_ORDER = [1,16,8,9,5,12,4,13,6,11,3,14,7,10,2,15];
const D = s => new Date(s+'T12:00:00').getTime();

// ═══════════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════════
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/&/g,' and ').replace(/['’`.]/g,'').replace(/[^a-z0-9]+/g,' ')
  .replace(/\bsaint\b/g,'st').replace(/\bstate\b/g,'st')
  .replace(/\buniversity\b|\bthe\b|\bof\b/g,' ').replace(/\s+/g,' ').trim();
const slug = s => norm(s).replace(/ /g,'-');
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function Phi(x){const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p;}
const wp = (ra,rb,adv=0,ta=0,tb=0) => Phi((ra-rb+adv)/Math.sqrt(CFG.SIGMA**2+ta*ta+tb*tb));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){try{localStorage.setItem(CFG.KEY+k,JSON.stringify(v));return true}catch(e){return false}}
function load(k,d){try{const v=localStorage.getItem(CFG.KEY+k);return v?JSON.parse(v):d}catch(e){return d}}

// ═══════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════
const CONFS = {};          // id -> {id, n, f, m, teams:[keys]}
const TEAMS = {};          // key -> team
const ALIAS = {};          // normalized name -> key
let DATA = load('data', null) || {ts:0, source:'seed', espn:{}, conf:{}, games:[], ext:{}, ap:{}, coaches:{}, weeks:{}, memberTs:0};
let HIST = load('hist', []);
let LOCKS = load('locks', {});
let M = {};                // model output

function buildTeams(){
  for (const k in CONFS) delete CONFS[k];
  for (const k in TEAMS) delete TEAMS[k];
  for (const k in ALIAS) delete ALIAS[k];
  for (const [id,n,f,m,str] of SEED_CONFS){
    CONFS[id] = {id,n,f,m,teams:[]};
    str.split('|').forEach(tok=>{
      let inel = tok.endsWith('!'); if(inel) tok = tok.slice(0,-1);
      const [head,...al] = tok.split('~'); const [name,r] = head.split(':');
      const key = slug(name);
      TEAMS[key] = {key,name,conf:id,prior:+r,seedPrior:+r,inel,active:true,espnId:null,logo:null,abbr:null};
      [name,...al].forEach(a=>ALIAS[norm(a)] = key);
    });
  }
  // Apply live membership / identity learned from ESPN
  for (const [key,info] of Object.entries(DATA.espn||{})){
    if(!TEAMS[key]){
      const c = CONFS[info.conf] ? info.conf : null; if(!c) continue;
      const base = avgPrior(c) - 2;
      TEAMS[key] = {key,name:info.name,conf:c,prior:base,seedPrior:base,inel:false,active:true};
    }
    Object.assign(TEAMS[key], {espnId:info.id, logo:info.logo||null, abbr:info.abbr||null, color:info.color||null});
    if(info.conf && CONFS[info.conf]) TEAMS[key].conf = info.conf;
  }
  if (DATA.memberTs && Object.keys(DATA.espn).length >= 300){
    for (const t of Object.values(TEAMS)) if(!DATA.espn[t.key]) t.active = false;
  }
  for (const t of Object.values(TEAMS)) if(t.active) CONFS[t.conf].teams.push(t.key);
}
function avgPrior(c){const ks=SEED_CONFS.find(x=>x[0]===c);if(!ks)return -5;
  const v=ks[4].split('|').map(s=>+s.split('~')[0].split(':')[1]);return v.reduce((a,b)=>a+b,0)/v.length;}
const T = k => TEAMS[k];
const tname = k => TEAMS[k] ? TEAMS[k].name : (DATA.ext[k] || 'TBD');
const short = k => { const n = tname(k); return n.length>15 ? n.replace(/ State$/,' St.').replace(/^North Carolina /,'N.C. ').replace(/^South Carolina /,'S.C. ') : n; };

// ═══════════════════════════════════════════════════════════════════
//  DATA LAYER — ESPN public JSON feed (works from any normal web host
//  or a locally opened file; set CFG.PROXY if your host blocks it)
// ═══════════════════════════════════════════════════════════════════
async function getJSON(url){
  const u = CFG.PROXY ? CFG.PROXY + encodeURIComponent(url) : url;
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 20000);
  try{ const r = await fetch(u,{cache:'no-store',signal:ctl.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(to); }
}
function matchConf(names){
  for (const c of Object.values(CONFS)) if (names.some(n=>n && c.m.test(n.trim()))) return c.id;
  return null;
}
function matchTeam(t, confHint){
  const cands = [t.location, t.shortDisplayName, t.nickname, t.abbreviation, t.displayName, t.name && t.location ? t.location : null];
  for (const c of cands){ const k = ALIAS[norm(c)]; if (k) return k; }
  // fuzzy: token overlap inside the conference hint
  if (confHint && CONFS[confHint]){
    const a = new Set(norm(t.location||t.displayName).split(' '));
    let best=null, bs=0;
    for (const k of CONFS[confHint].teams){ const b=norm(TEAMS[k].name).split(' ');
      const s = b.filter(x=>a.has(x)).length*2/(a.size+b.length); if(s>bs){bs=s;best=k;} }
    if (bs>=0.66) return best;
  }
  return null;
}
function learnTeam(t, conf){
  let key = matchTeam(t, conf);
  if (!key) key = 'e'+t.id;
  const logo = t.logos?.[0]?.href || t.logo || null;
  const prev = DATA.espn[key] || {};
  DATA.espn[key] = {id:String(t.id), name: prev.name || (TEAMS[key]?.name) || t.location || t.displayName, abbr:t.abbreviation||prev.abbr, logo:logo||prev.logo, color:t.color||prev.color, conf: conf || prev.conf};
  if (!ALIAS[norm(t.location)]) ALIAS[norm(t.location||'')] = key;
  return key;
}
const E2K = () => { const m={}; for (const [k,v] of Object.entries(DATA.espn)) m[v.id]=k; return m; };

async function loadMembership(){
  let found = 0;
  try{
    const js = await getJSON(`${CFG.ESPN2}/standings?group=50&season=${CFG.SEASON}`);
    for (const ch of (js.children||[])){
      const cid = matchConf([ch.name, ch.abbreviation, ch.shortName]); if(!cid) continue;
      for (const e of (ch.standings?.entries||[])){ if(e.team){ learnTeam(e.team,cid); found++; } }
    }
  }catch(e){ console.warn('standings', e); }
  if (found < 300){
    const js = await getJSON(`${CFG.ESPN}/groups?season=${CFG.SEASON}`);
    const walk = g => { const cid = matchConf([g.name,g.abbreviation,g.shortName]);
      if (cid && g.teams) for (const t of g.teams){ learnTeam(t,cid); found++; }
      (g.children||[]).forEach(walk); };
    (js.groups||[]).forEach(walk);
  }
  if (found >= 300) DATA.memberTs = Date.now();
  buildTeams();
  return found;
}
async function loadRankings(){
  const js = await getJSON(`${CFG.ESPN}/rankings?season=${CFG.SEASON}`);
  const id2k = E2K(); const out = {ap:{},coaches:{}};
  for (const r of (js.rankings||[])){

  for (const g of M.tg){ if (g.st!==2) continue; const id = nodeFor(br,pos,g.h,g.a); if(id) res[id] = g.hs>g.as ? g.h : g.a; }
  return res;
}
function detectPhase(){
  const now = Date.now();
  if (M.tg?.some(g=>g.round==='NCG' && g.st===2)) return 'done';
  if (now < D(CFG.SEASON_START)) return 'pre';
  if (now < D(CFG.CONF_TOURNEYS)) return 'reg';
  if (now < D(CFG.SELECTION_SUNDAY)) return 'conf';
  if (now < D('2027-03-16')) return 'sel';
  const order = ['OR','R64','R32','S16','E8','F4','NCG'];
  for (const r of order){ const gs = M.tg.filter(g=>g.round===r); if (gs.length < RGAMES[r] || gs.some(g=>g.st!==2)) return r; }
  return 'done';
}
function roundsComplete(){
  const out=[]; for (const r of ['OR','R64','R32','S16','E8','F4','NCG']){ const gs=(M.tg||[]).filter(g=>g.round===r&&g.st===2); if(gs.length>=RGAMES[r]) out.push(r); else break; } return out;
}
function recompute(){
  buildTeams();
  aggregate();
  computeRatings();
  M.tg = tourneyGames();
  projectField();
  const actual = Date.now() >= D(CFG.SELECTION_SUNDAY) ? buildActualBracket(M.tg) : null;
  M.bracket = actual || buildProjectedBracket();
  if (actual){ const pos = leafIndex(actual); for (const t of Object.values(TEAMS)) if (t.active) t.make = pos[t.key] ? 1 : 0; }
  M.results = detectResults(M.bracket);
  M.official = simulate(M.bracket, M.results);
  const activeLocks = {}; let nl=0;
  for (const [id,k] of Object.entries(LOCKS)) if (!M.results[id]){ activeLocks[id]=k; nl++; }
  M.nLocks = nl;
  M.view = nl ? simulate(M.bracket, {...activeLocks, ...M.results}) : M.official;
  M.pos = leafIndex(M.bracket);
  M.phase = detectPhase();
  M.done = roundsComplete();
}

function snapshot(label){
  const teams = {};
  for (const t of Object.values(TEAMS)){
    if (!t.active) continue;
    const r = M.official[t.key], p = M.pos[t.key];
    if (!r && t.prank>120) continue;
    teams[t.key] = [t.prank, p?p.seed:0, p?p.ri:-1, r?+r.CH.toFixed(5):0, r?+r.F4.toFixed(4):0, r?+r.S16.toFixed(4):0, +t.make.toFixed(3), +t.rating.toFixed(2)];
  }
  return {ts: DATA.ts || Date.now(), label, phase: M.phase, games: M.games.filter(g=>g.st===2).length, teams};
}
function phaseLabel(){
  const p = M.phase, done = M.done;
  if (p==='pre') return 'Preseason';
  if (p==='reg') return 'Regular season';
  if (p==='conf') return 'Conference tournaments';
  if (p==='sel') return 'Selection Sunday';
  if (p==='done') return 'Tournament complete';
  return done.length ? `After ${RLABEL[done[done.length-1]]}` : RLABEL[p];
}
function pushSnapshot(){
  const s = snapshot(phaseLabel());

  const sig = x => JSON.stringify(x.teams);
  if (last && sig(last)===sig(s)){ last.ts = s.ts; }
  else HIST.push(s);
  if (HIST.length>60) HIST = [HIST[0], ...HIST.slice(-59)];
  store('hist', HIST);
}
const prevSnap = () => HIST.length>=2 ? HIST[HIST.length-2] : null;

function teamRow(k, prob, node, extra=''){
  if (!k) return `<div class="bt tbd"><span class="sd"></span><span class="nm">TBD</span></div>`;
  const locked = node && (LOCKS[node]===k), won = node && M.results[node]===k, lost = node && M.results[node] && M.results[node]!==k;
  const sd = M.pos[k]?.seed ?? '';
  return `<div class="bt${won?' won':''}${lost?' lost':''}${locked?' locked':''}" data-team="${esc(k)}" data-node="${node||''}" role="button" tabindex="0">
    <span class="sd">${sd}</span><span class="nm">${esc(short(k))}${extra}</span><span class="pr">${won?'W':prob}</span></div>`;
}
function likely(dist){ let best=null,bp=-1; for (const k in dist) if(dist[k]>bp){bp=dist[k];best=k;} return best; }
function regionDists(ri){
  // Most likely occupant of each slot, per round, from view probabilities
  const reg = M.bracket.regions[ri];
  const R = M.view;
  const leafTeams = reg.leaves.map(l=> l.or ? [M.bracket.orGames.find(g=>g.id===l.or).a, M.bracket.orGames.find(g=>g.id===l.or).b] : [l.team]);
  const rounds = [];
  const labs = ['R64','R32','S16','E8','F4'];
  for (let r=0;r<=4;r++){
    const size = 2**r, slots=[];
    for (let i=0;i<16/size;i++){
      const ks = leafTeams.slice(i*size,(i+1)*size).flat();
      const dist = {}; ks.forEach(k=>dist[k]=R[k]?.[labs[r]]||0);
      slots.push({k:likely(dist), p: dist[likely(dist)]||0, dist});
    }
    rounds.push(slots);
  }
  return rounds;
}
function renderRegion(ri){
  const reg = M.bracket.regions[ri]; const rd = regionDists(ri);
  const cols = [];
  const names = ['First round','Second round','Sweet 16','Elite Eight'];
  for (let r=0;r<4;r++){
    const games=[];
    for (let i=0;i<rd[r].length;i+=2){
      const node = `${ri}-${r+1}-${i/2}`;
      const A = rd[r][i], B = rd[r][i+1];
      const next = ['R32','S16','E8','F4'][r];
      const pw = s => { if(!s.k) return ''; const here = M.view[s.k]?.[['R64','R32','S16','E8'][r]]||0; const nx = M.view[s.k]?.[next]||0; return here ? pct(nx/here) : '—'; };
      let rowA, rowB;
      if (r===0){
        const la = reg.leaves[i], lb = reg.leaves[i+1];
        const row = (l,s) => l.or ? orRow(l, node) : teamRow(l.team, pw(s), node);
        rowA = row(la,A); rowB = row(lb,B);
      } else {
        const sub = s => s.p<0.9995 ? ` <em>${pct(s.p)}</em>` : '';
        rowA = teamRow(A.k, pw(A), node, sub(A)); rowB = teamRow(B.k, pw(B), node, sub(B));
      }
      games.push(`<div class="bg">${rowA}${rowB}</div>`);
    }
    cols.push(`<div class="bcol r${r}"><h4>${names[r]}</h4><div class="bgames">${games.join('')}</div></div>`);
  }
  const champ = rd[4][0];

  return `<section class="region" style="--rc:var(--rg${ri})"><header><h3>${reg.name}</h3><span>${regionNote(ri)}</span></header><div class="bscroll"><div class="bgrid">${cols.join('')}</div></div></section>`;
}

function orRow(l, node){
  const g = M.bracket.orGames.find(x=>x.id===l.or);

function heat(p,c){ const cap={R32:1,S16:.8,E8:.6,F4:.45,NCG:.3,CH:.2}[c]; const a = Math.min(1,p/cap);

function renderMovement(){
  const prev = prevSnap();
  if (!prev){
    $('#pane-move').innerHTML = `<div class="empty"><h3>Changes show up after your next refresh</h3><p>The ${esc(HIST[0]?.label||'preseason')} forecast was saved ${HIST[0]?new Date(HIST[0].ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''} as the starting point. Each time you select <strong>Refresh data</strong>, the new forecast is compared to the one before it, and the trend lines below grow.</p></div>${trendChart()}`;
    return;
  }
  const cur = HIST[HIST.length-1];
  const keys = new Set([...Object.keys(cur.teams),...Object.keys(prev.teams)]);
  const rows = [...keys].map(k=>{ const a=cur.teams[k]||[999,0,-1,0,0,0,0,0], b=prev.teams[k]||[999,0,-1,0,0,0,0,0];
    return {k, dCH:(a[3]-b[3])*100, dF4:(a[4]-b[4])*100, seedA:a[1], seedB:b[1], dRank:b[0]-a[0], make:a[6], dMake:(a[6]-b[6])*100, dRating:a[7]-b[7]}; }).filter(x=>TEAMS[x.k]);
  const list = (arr, fmt, cap=12) => arr.length ? `<ol class="mv">${arr.slice(0,cap).map(fmt).join('')}</ol>${arr.length>cap?`<p class="mut small">and ${arr.length-cap} more</p>`:''}` : `<p class="mut">No changes.</p>`;
  const risers = rows.filter(r=>r.dCH>0.05).sort((a,b)=>b.dCH-a.dCH).slice(0,8);
  const fallers = rows.filter(r=>r.dCH<-0.05).sort((a,b)=>a.dCH-b.dCH).slice(0,8);
  const seedUp = rows.filter(r=>r.seedA&&r.seedB&&r.seedA<r.seedB).sort((a,b)=>(a.seedA-a.seedB)-(b.seedA-b.seedB)).slice(0,8);
  const seedDn = rows.filter(r=>r.seedA&&r.seedB&&r.seedA>r.seedB).sort((a,b)=>(b.seedA-b.seedB)-(a.seedA-a.seedB)).slice(0,8);
  const inF = rows.filter(r=>r.seedA&&!r.seedB), outF = rows.filter(r=>!r.seedA&&r.seedB);
  const f = r => { const v = cur.teams[r.k]?.[3]||0; const out = !v && M.pos[r.k] && M.bracket.source==='official';
    return `<li>${tlink(r.k)}<span class="num">${out?'Eliminated':(v*100).toFixed(1)+'%'} <span class="dl ${r.dCH>0?'up':'dn'}">${sgn(r.dCH)} pts</span></span></li>`; };
  const fs = r => `<li>${tlink(r.k)}<span class="num">${r.seedB} → <strong>${r.seedA}</strong></span></li>`;
  $('#pane-move').innerHTML = `
    <p class="lede">Comparing <strong>${esc(cur.label)}</strong> (${new Date(cur.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}, ${cur.games} games final) with <strong>${esc(prev.label)}</strong> (${new Date(prev.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}, ${prev.games} games final).</p>
    <div class="mvgrid">
      <section><h3>Title odds up</h3>${list(risers,f)}</section>
      <section><h3>Title odds down</h3>${list(fallers,f)}</section>
      <section><h3>Seed line improved</h3>${list(seedUp,fs)}</section>
      <section><h3>Seed line dropped</h3>${list(seedDn,fs)}</section>
      <section><h3>Moved into the field</h3>${list(inF, r=>`<li>${tlink(r.k)}<span class="num">${r.seedA} seed</span></li>`)}</section>
      <section><h3>Moved out of the field</h3>${list(outF, r=>`<li>${tlink(r.k)}<span class="num">was ${r.seedB}</span></li>`)}</section>
    </div>${trendChart()}`;
}
const PALETTE = ['#009cde','#000000','#63666a','#0077c8','#009cde','#000000','#63666a','#0077c8'];
function trendChart(keys){
  const H = HIST; if (!H.length) return '';
  keys = keys || Object.entries(M.official).sort((a,b)=>b[1].CH-a[1].CH).slice(0,8).map(x=>x[0]);
  const w=720,h=260,pl=44,pr=150,pt=16,pb=34;
  const n = H.length; const xs = i => n===1 ? pl+(w-pl-pr)/2 : pl + i*(w-pl-pr)/(n-1);
  let mx = 0; keys.forEach(k=>H.forEach(s=>mx=Math.max(mx,(s.teams[k]?.[3]||0)*100))); mx = Math.max(5, Math.ceil(mx/5)*5);
  const ys = v => pt + (h-pt-pb)*(1-v/mx);
  const grid = [0,mx/2,mx].map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${ys(v)}" y2="${ys(v)}" class="gl"/><text x="${pl-6}" y="${ys(v)+4}" text-anchor="end" class="ax">${v}%</text>`).join('');
  const labels = []; 
  const lines = keys.map((k,i)=>{ const pts = H.map((s,j)=>[xs(j), ys((s.teams[k]?.[3]||0)*100)]);
    const c = PALETTE[i%PALETTE.length]; const last = pts[pts.length-1]; labels.push({y:last[1],k,c});
    return `<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2"${i>=4?' stroke-dasharray="5 4"':''}/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${c}"/>`).join('')}`; }).join('');
  labels.sort((a,b)=>a.y-b.y); for (let i=1;i<labels.length;i++) if (labels[i].y-labels[i-1].y<13) labels[i].y=labels[i-1].y+13;
  const lab = labels.map(l=>`<text x="${w-pr+8}" y="${l.y+4}" class="lb" fill="${l.c}">${esc(short(l.k))}</text>`).join('');
  const xl = H.map((s,j)=> (n<=8 || j===0 || j===n-1 || j%Math.ceil(n/6)===0) ? `<text x="${xs(j)}" y="${h-12}" text-anchor="middle" class="ax">${new Date(s.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`:'').join('');
  return `<section class="trend"><h3>Title odds by refresh <small>current top 8</small></h3><div class="tscroll"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Championship probability over time for the top eight contenders">${grid}${lines}${lab}${xl}</svg></div></section>`;
}

function gamesBlock(games, mode, name, focus){

}

// ─── Method ───────────────────────────────────────────────────────
function renderMethod(){
  $('#pane-method').innerHTML = `<article class="method">
  <h2>How the forecast works</h2>
  <p><strong>Power rating.</strong> Every Division I team starts the season with a preseason rating: projected points better than an average D-I team on a neutral floor. Once the AP preseason poll is published (October), ranked teams blend halfway toward it. Each completed game then adjusts ratings using the scoring margin (capped at 25), the opponent's rating, and a ${CFG.HCA}-point home-court edge. The preseason rating counts as ${CFG.PRIOR_GAMES} games, so it fades as the real season builds up.</p>
  <p><strong>Single-game odds.</strong> The chance one team beats another is a normal curve on the rating gap with an ${CFG.SIGMA}-point standard deviation. A 5-point favorite wins about 67% of the time; a 10-point favorite about 82%.</p>
  <p><strong>Selecting the field.</strong> The 2027 tournament has 76 teams: 32 automatic bids and 44 at-large bids. Each conference's projected champion is its best team by rating and league record, until a conference tournament final is in the feed. At-large teams are the best remaining by rating plus a win-percentage adjustment. Teams reclassifying to Division I (West Florida, West Georgia, Le Moyne, Mercyhurst, New Haven) are excluded.</p>
  <p><strong>Building the bracket.</strong> The 76 teams are ranked 1–76. The 12 lowest automatic qualifiers and 12 lowest at-large teams pair off in the Opening Round. Everyone else is placed on an S-curve across four regions, keeping teams from the same conference apart on the top eight lines. After Selection Sunday the app switches to the official bracket as soon as it appears in the feed.</p>
  <p><strong>Round-by-round odds.</strong> Probabilities are computed exactly through every possible path in the bracket, not by random simulation. Finished tournament games are locked in, so each refresh after a round re-forecasts only what is left.</p>
  <p><strong>Tracking change.</strong> Each refresh saves a snapshot of every team's power rank, seed, and round odds in this browser. The Title odds, What changed, and team views compare the latest forecast with the one before it.</p>
  <p><strong>Data.</strong> Refresh data reads ESPN's public scoreboard, standings, and rankings feeds: conference membership, results, schedules, TV, venues, and box-score totals for team stats. It works when this page is served from a normal website or opened as a local file. If a host blocks outside requests, set <code>CFG.PROXY</code> at the top of the script to your own proxy.</p>
  <p class="mut">Not affiliated with the NCAA or ESPN. For entertainment and planning; not betting advice.</p>
  <p><button class="btn-q" id="reset-hist">Clear saved history</button></p></article>`;
}

      `Forecast updated${pv?` · compared with ${new Date(pv.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}`:''}.`, fails.length?'warn':'ok');
  } else {
    toast(`Couldn't reach the ESPN data feed from this page. Open the file from a web host or locally, or set a proxy in CFG.PROXY. Showing saved data.`, 'err');
  }
  setBusy(false);
}
function lockPath(node, k){
  // Advancing a team also advances it through earlier rounds of its path
  if (LOCKS[node]===k){ // unlock this node and anything later that depends on it
    for (const id of Object.keys(LOCKS)) if (LOCKS[id]===k) delete LOCKS[id];
  } else {
    const pos = M.pos[k]; if(!pos) return;
    const [a,b,c] = node.split('-'); 
    if (pos.or) LOCKS[pos.or]=k;
    if (node.startsWith('OR')) { LOCKS[node]=k; }
    else if (a==='F'){ for (let r=1;r<=4;r++) LOCKS[`${pos.ri}-${r}-${Math.floor(pos.li/2**r)}`]=k; if(+b===6){ const semi=M.bracket.ff.findIndex(p=>p.includes(pos.ri)); LOCKS[`F-5-${semi}`]=k; } LOCKS[node]=k; }
    else { for (let r=1;r<=+b;r++) LOCKS[`${pos.ri}-${r}-${Math.floor(pos.li/2**r)}`]=k; }
  }
  store('locks', LOCKS); recompute(); renderAll();
}
function bind(){
  document.addEventListener('click', e=>{
    const tab = e.target.closest('.tab'); if (tab){ UI.tab=tab.dataset.tab; store('tab',UI.tab); renderAll(); window.scrollTo({top:0}); return; }
    const bt = e.target.closest('.bt[data-node]');
    if (bt && UI.whatIf && bt.dataset.node && !e.target.closest('#drawer')){ lockPath(bt.dataset.node, bt.dataset.team); return; }
    const tl = e.target.closest('[data-team]'); if (tl){ openTeam(tl.dataset.team); return; }
    const el = e.target.closest('[data-region],[data-conf],[data-confgames],[data-teamgames],[data-oddsall],[data-sort]');
    if (el){
      if (el.dataset.region!==undefined) UI.region = el.dataset.region;
      if (el.dataset.conf) { UI.conf = el.dataset.conf; store('conf',UI.conf); }
      if (el.dataset.confgames) UI.confGames = el.dataset.confgames;
      if (el.dataset.teamgames) { UI.teamGames = el.dataset.teamgames; renderTeam(); return; }
      if (el.dataset.oddsall) UI.oddsAll = el.dataset.oddsall==='1';
      if (el.dataset.sort){ const c=el.dataset.sort, same=UI.oddsSort.col===c; UI.oddsSort = {col:c, dir: same ? -UI.oddsSort.dir : (c==='name'?1:-1)}; }
      PANES[UI.tab](); return;
    }
    if (e.target.id==='clear-locks'){ LOCKS={}; store('locks',LOCKS); recompute(); renderAll(); return; }
    if (e.target.id==='reset-hist'){ if(confirm('Clear all saved forecast snapshots? The current forecast becomes the new starting point.')){ HIST=[]; pushSnapshot(); renderAll(); toast('History cleared.'); } return; }
    if (e.target.closest('#drawer .x') || e.target.id==='drawer'){ closeTeam(); return; }
  });
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape' && UI.team) closeTeam();
    if ((e.key==='Enter'||e.key===' ') && e.target.matches('.bt[data-team]')){ e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', e=>{
    if (e.target.id==='whatif'){ UI.whatIf = e.target.checked; renderBracket(); }
    if (e.target.id==='auto'){ store('auto', e.target.checked); setAuto(e.target.checked); }
  });
  document.addEventListener('input', e=>{ if (e.target.id==='odds-q'){ UI.oddsQ = e.target.value; const pos=e.target.selectionStart; renderOdds(); const q=$('#odds-q'); q.focus(); q.setSelectionRange(pos,pos); } });
  $('#refresh').addEventListener('click', refreshData);
}
let autoTimer = null;
function setAuto(on){ clearInterval(autoTimer); if (on) autoTimer = setInterval(()=>{ if(!document.hidden) refreshData(); }, 15*60*1000); }
function boot(){
  recompute();
  if (!HIST.length) pushSnapshot();
  bind(); renderAll();
  const auto = load('auto', false); $('#auto').checked = auto; setAuto(auto);
  if (!DATA.ts || auto) refreshData();
}

boot();
</script>
